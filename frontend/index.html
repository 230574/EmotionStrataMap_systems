<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmotionStrataMap</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
      }
      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 32px;
        width: min(500px, 90vw);
      }
      h1 {
        margin-top: 0;
      }
      .message {
        margin-top: 16px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #1f2937;
      }
      .status {
        margin-top: 12px;
        color: #4b5563;
      }
      button {
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>EmotionStrataMap</h1>
      <button id="loadButton" type="button">Load backend message</button>
      <div id="message" class="message">Loading...</div>
      <div id="status" class="status"></div>
    </main>

    <script>
      const messageEl = document.getElementById('message');
      const statusEl = document.getElementById('status');

      async function loadMessage() {
        try {
          const response = await fetch('http://localhost:8080/api/hello', {
            method: 'GET',
            mode: 'cors'
          });

          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }

          const data = await response.json();
          messageEl.textContent = data.message;
          statusEl.textContent = 'Connected to local backend (' + data.status + ')';
        } catch (error) {
          messageEl.textContent = 'Unable to connect';
          statusEl.textContent = error.message;
        }
      }

      document.getElementById('loadButton').addEventListener('click', loadMessage);
      loadMessage();
    </script>
  </body>
</html>
